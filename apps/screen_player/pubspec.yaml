name: screen_player
description: Digital Chalkboard Screen Player
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  path_provider: ^2.1.2
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Gobsmacked
      fonts:
        - asset: assets/fonts/Gobsmacked.otf

    - family: ConteScriptReduced
      fonts:
        - asset: assets/fonts/ConteScriptReduced.ttf

    - family: KillingLoneliness
      fonts:
        - asset: assets/fonts/KillingLoneliness.ttf

    - family: Tafelschrift
      fonts:
        - asset: assets/fonts/Tafelschrift.ttf